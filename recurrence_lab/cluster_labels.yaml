# Cluster triage labels — the durable record.
#
# Edit in-browser via viewer.html's Triage panel, then click
# "Export labels.yaml" to download the full state. Save the download
# here and run:
#
#     python apply_labels.py
#
# Match key: `exemplar` is the path to the cluster's exemplar
# (`columns/<issue>/ads/p<n>/<file>.png`). Labels bind to the
# exemplar, not the volatile cluster_id, so they survive re-runs of
# `cluster.py` even when IDs renumber.
#
# Categories (one of):
#   ad             — real recurring ad (positive query for goal-1 recall)
#   body_text_fp   — body text falsely caught as an ad (negative query)
#   furniture      — masthead / banner / standing section header
#   unclassified   — default; record appearances but emit no proposals
#
# `reject_members:` — list of image_filenames that don't belong in the
# cluster. Authoritative-overwrite: anything not listed gets un-rejected.
# `name` shared across two clusters (same category) is a logical merge.

