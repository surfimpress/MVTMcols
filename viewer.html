<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Almonte Gazette — Processed Issues</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-padding-top: 145px; }
body { font-family: -apple-system, system-ui, sans-serif; background: #f5f5f0; color: #333; padding: 0 20px 20px; }
#page-header { position: sticky; top: 0; background: #f5f5f0; padding: 14px 20px 10px; margin: 0 -20px 14px; z-index: 10; border-bottom: 1px solid #ddd; }
#page-header h1 { margin-bottom: 8px; }
#decade-nav { display: flex; gap: 4px; flex-wrap: wrap; }
#decade-nav a {
    color: #4488ff; text-decoration: none;
    padding: 4px 10px; border-radius: 4px;
    font-size: 0.95em; cursor: pointer;
    /* Reserve space for the active-state underline so toggling the
       active class doesn't cause layout shift. */
    border-bottom: 3px solid transparent;
}
#decade-nav a:hover { background: #e8e8e0; text-decoration: underline; }
#decade-nav a.active {
    border-bottom-color: black;
    border-radius: 4px 4px 0 0;
}
.decade-header { font-size: 1.1em; color: #555; margin-top: 6px; padding-top: 12px; border-top: 1px solid #ddd; }
.decade-header:first-child { border-top: none; padding-top: 0; margin-top: 0; }
.decade-controls { margin: 2px 0 10px 0; font-size: 0.85em; }
.global-expand { margin-top: 6px; font-size: 0.85em; }
.year-block { margin-bottom: 8px; }
.year-block > summary { background: #efece5; font-size: 1em; }
.year-block > summary:hover { background: #e5e2db; }
/* Years with >40 processed issues get a slightly darker summary so
   progress is visible at a glance from the decade view. Threshold is
   nominal — a "handful" sample run is <10, a full year is 50-300+. */
.year-block.well-progressed > summary { background: #d8d2c0; }
.year-block.well-progressed > summary:hover { background: #cec7b3; }
/* Empty placeholder years (no issues processed yet) — light grey,
   close to white, dim text so they recede visually but stay
   navigable as a complete year list. */
.year-block.empty > summary { background: #f5f5f3; color: #999; }
.year-block.empty > summary:hover { background: #ececea; }
/* Gap years (the paper did not publish that year). Distinct from
   "not yet processed" so the user can tell history from to-do. */
.year-block.gap-year > summary { background: #ece8de; color: #888; font-style: italic; }
.year-block.gap-year > summary:hover { background: #e3dfd5; }
.year-block .year-content {
    display: grid; gap: 15px;
    padding: 12px 15px;
}
.year-block .issue-card { margin: 0; }
h1 { font-size: 1.8em; margin-bottom: 5px; }
.subtitle { color: #666; margin-bottom: 20px; }
.issue-list { display: grid; gap: 15px; margin-bottom: 30px; }
.issue-card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 15px; cursor: pointer; position: relative; }
.issue-card:hover { border-color: #999; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.issue-card h2 { font-size: 1.2em; margin-bottom: 5px; }
.issue-card .stats { color: #666; font-size: 0.9em; }
/* Pass badges — top-right, neutral colour (user is colour-blind, so
   the digit carries the meaning; no green/red signalling). */
.pass-badges { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; }
.pass-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 50%;
    background: #2c3e50; color: white;
    font-size: 0.78em; font-weight: 600;
    line-height: 1;
}
.pass-badge[title] { cursor: help; }
.iiif-btn { background: #6a4f9a; color: white; border-color: #4a3578; }
.iiif-btn:hover { background: #7a5fb0; color: white; }
.detail-title { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
.detail-title .pass-badges { position: static; }
.issue-detail { display: none; background: white; border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin-bottom: 30px; }
.issue-detail.active { display: block; }
.back-btn { display: inline-block; margin-bottom: 15px; padding: 5px 12px; background: #eee; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; text-decoration: none; color: #333; }
.thumb { max-width: 120px; border: 1px solid #ddd; border-radius: 4px; }
.thumb-wide { max-width: 300px; }
.thumb-row { display: flex; flex-wrap: wrap; gap: 8px; }
.cols-row { display: flex; flex-wrap: nowrap; gap: 6px; align-items: flex-start; width: 100%; }
.cols-row a { flex: 1 1 0; min-width: 0; display: block; }
.cols-row img { width: 100%; height: auto; max-width: none; display: block; }
.cols-row a:hover img { transform: none; }
.flag { display: inline-block; background: #fff3cd; color: #856404; font-size: 0.75em; padding: 1px 6px; border-radius: 3px; margin-right: 4px; }
.detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.detail-header-left { display: flex; align-items: center; gap: 30px; }
.inspector-btn { background: #4488ff; color: white; border-color: #2266dd; }
.inspector-btn:hover { background: #5599ff; color: white; }
.expand-ctrl { font-size: 0.85em; color: #4488ff; }
.expand-ctrl a { color: #4488ff; cursor: pointer; text-decoration: none; }
.expand-ctrl a:hover { text-decoration: underline; }
.issue-nav { margin-top: 20px; padding-top: 12px; border-top: 1px solid #eee; display: flex; justify-content: space-between; font-size: 0.9em; }
.issue-nav a { color: #4488ff; text-decoration: none; cursor: pointer; }
.issue-nav a:hover { text-decoration: underline; }
.issue-nav .placeholder { color: #ccc; }
a img { transition: transform 0.15s; }
a img:hover { transform: scale(1.05); }
details { margin-bottom: 10px; border: 1px solid #eee; border-radius: 6px; }
details[open] { padding-bottom: 10px; }
details summary { padding: 10px 15px; cursor: pointer; font-weight: 500; background: #fafaf8; border-radius: 6px; }
details summary:hover { background: #f0f0ea; }
details[open] summary { border-bottom: 1px solid #eee; border-radius: 6px 6px 0 0; }
.page-content { padding: 10px 15px; }
details.ads-section summary { background: #f8f5ee; }
#loading { color: #999; font-style: italic; }
.totals { color: #666; font-size: 0.9em; margin-bottom: 15px; }
</style>
</head>
<body>
<header id="page-header">
<h1>Almonte Gazette</h1>
<nav id="decade-nav"></nav>
<div class="global-expand expand-ctrl">
    <a onclick="setAllYearsOpen(true)">expand all years</a>
    |
    <a onclick="setAllYearsOpen(false)">close all years</a>
</div>
</header>
<p class="subtitle">Processed Issues — Column Extraction Pipeline</p>
<div id="totals" class="totals"></div>
<div id="loading">Loading data...</div>
<div id="issue-list" class="issue-list"></div>
<div id="details-container"></div>

<script>
const BASE = '/MVTM/columns';

// Caching strategy:
// Plain `fetch(url)` with no cache-busting query string and no
// `cache: 'no-store'` directive. The browser keeps each JSON in its
// HTTP cache and asks the server `If-Modified-Since` on the next
// load — which returns 304 (use cached) for unchanged files and 200
// (fresh body) for changed files. Server-side, every JSON we write
// uses `os.replace(tmp, path)`, which updates the file mtime — so
// `Last-Modified` on the response is the source of truth. No client-
// side TTL guesswork; the network handles it.
//
// Index is small (~60KB at 430 issues). Per-issue files are tiny
// (2-40KB each) and fetched on demand only when the user expands
// the issue. Once cached they're free until that issue is reprocessed.

// In-memory cache of per-issue payloads we've already fetched.
const issueCache = new Map();
// Index issues, populated from index.json — keyed by `dir` for lookup.
let indexIssues = [];
const indexByDir = new Map();
// Transcribe status, loaded from columns/transcribe_status.json.
// Keyed by `dir` (YYYY-MM-DD); shape: {pass1, pass2, manifest_dir, ...}.
// Issues with no transcribe footprint are simply absent.
let transcribeStatus = {};

async function init() {
    try {
        // index.json is required; transcribe_status.json is optional —
        // a fresh checkout that hasn't run the transcribe pipeline yet
        // simply shows no badges. Run them in parallel.
        const [resp, statusResp] = await Promise.all([
            fetch(BASE + '/index.json'),
            fetch(BASE + '/transcribe_status.json').catch(() => null),
        ]);
        const data = await resp.json();
        indexIssues = data.issues || [];
        for (const i of indexIssues) indexByDir.set(i.dir, i);
        if (statusResp && statusResp.ok) {
            try {
                const sd = await statusResp.json();
                transcribeStatus = sd.issues || {};
            } catch (_) { transcribeStatus = {}; }
        }

        document.getElementById('loading').style.display = 'none';
        renderList(indexIssues);
        renderDecadeNav(indexIssues);

        const totalCols = indexIssues.reduce((s, i) => s + (i.n_cols || 0), 0);
        const totalAds = data.total_ads
            ?? indexIssues.reduce((s, i) => s + (i.n_ads || 0), 0);
        const totalPages = data.total_gazette_pages || 0;
        const processed = data.total_processed || 0;
        const pct = data.pct_done || 0;
        const statsLine = totalPages > 0
            ? `${processed} of ${totalPages.toLocaleString()} pages processed (${pct}%) \u2022 ${indexIssues.length} issues \u2022 ${totalCols} columns \u2022 ${totalAds} ads`
            : `${indexIssues.length} issues \u2022 ${totalCols} columns \u2022 ${totalAds} ads`;
        document.getElementById('totals').textContent = statsLine;
    } catch (e) {
        document.getElementById('loading').textContent = 'Failed to load data: ' + e.message;
    }
}

// Fetch one issue's full payload (pages + ads). Plain fetch — HTTP
// cache + If-Modified-Since handles staleness.
async function loadIssue(dir) {
    if (issueCache.has(dir)) return issueCache.get(dir);
    const resp = await fetch(`${BASE}/issues/${dir}.json`);
    if (!resp.ok) throw new Error(`Failed to load ${dir}: ${resp.status}`);
    const payload = await resp.json();
    issueCache.set(dir, payload);
    return payload;
}

// Pass badges: "1" when pass-1A + pass-1B are complete for the issue,
// "2" joins it once pass-2 has produced items on every page. Drawn
// top-right of the card; the digit carries the meaning (no colour
// signalling — user is colour-blind).
function renderPassBadges(dir) {
    const s = transcribeStatus[dir];
    if (!s) return '';
    const parts = [];
    if (s.pass1) {
        const tip = `Pass 1 complete: ${s.n_cols_done}/${s.n_cols_expected} columns, ${s.n_ads_done}/${s.n_ads_expected} ads`;
        parts.push(`<span class="pass-badge" title="${tip}">1</span>`);
    }
    if (s.pass2) {
        const tip = `Pass 2 complete: items extracted on ${s.n_pages_with_items}/${s.n_pages_expected} pages`;
        parts.push(`<span class="pass-badge" title="${tip}">2</span>`);
    }
    if (parts.length === 0) return '';
    return `<div class="pass-badges">${parts.join('')}</div>`;
}

// Full corpus year span. Every year in this range gets a year-block
// in the viewer so the user can see progress at a glance. The earliest
// PDF in mvtm.db is 1861 (24 issues registered); the latest is 2007.
const CORPUS_START_YEAR = 1861;
const CORPUS_END_YEAR = 2007;
// Years inside the corpus span where the paper itself did not publish.
// Verified 2026-05-07 by querying distinct years in `files`: 1864 is
// the only gap in 1862-2007. (1987 was a deletion of poor-quality
// modern scans — not a publication gap; expect 1987 to repopulate
// once cutting quality for the 1980s+ is addressed.)
const PUBLICATION_GAP_YEARS = new Set([1864]);

// Per-year override of the "well-progressed" issue threshold (default 40).
// In the 1860s the paper itself often published far fewer than 40
// issues per year, so the at-a-glance dark-bar should kick in once
// the year's actually-published total is reached. Counts verified
// 2026-05-07 against distinct issue-dates in `files`. Add entries as
// other sparse years surface; the default of 40 handles full years.
const YEAR_PROGRESS_THRESHOLDS = {
    1861: 24,
    1862: 20,
    1863: 3,
    1865: 5,
    1866: 2,
    1867: 14,
};

function renderList(issues) {
    const el = document.getElementById('issue-list');

    // Group existing issues by year for fast lookup.
    const byYear = new Map();
    for (const issue of issues) {
        if (!byYear.has(issue.year)) byYear.set(issue.year, []);
        byYear.get(issue.year).push(issue);
    }

    // Walk the full corpus span. Each year emits a <details> block —
    // populated, empty placeholder, or publication-gap — so the user
    // gets a complete year list with at-a-glance progress shading.
    const parts = [];
    let lastDecade = null;
    for (let year = CORPUS_START_YEAR; year <= CORPUS_END_YEAR; year++) {
        const decade = Math.floor(year / 10) * 10;
        if (decade !== lastDecade) {
            lastDecade = decade;
            parts.push(`<h3 class="decade-header" id="decade-${decade}">${decade}</h3>`);
            parts.push(`<div class="decade-controls expand-ctrl">
                <a onclick="setDecadeYearsOpen(${decade}, true)">expand all</a>
                |
                <a onclick="setDecadeYearsOpen(${decade}, false)">close all</a>
            </div>`);
        }

        if (PUBLICATION_GAP_YEARS.has(year)) {
            parts.push(`<details class="year-block gap-year" data-decade="${decade}" data-year="${year}">
                <summary>${year} \u2014 paper did not publish</summary>
                <div class="year-content"></div>
            </details>`);
            continue;
        }

        const yearIssues = byYear.get(year);
        if (!yearIssues || yearIssues.length === 0) {
            parts.push(`<details class="year-block empty" data-decade="${decade}" data-year="${year}">
                <summary>${year} \u2014 not yet processed</summary>
                <div class="year-content"></div>
            </details>`);
            continue;
        }

        const nIssues = yearIssues.length;
        const nCols = yearIssues.reduce((s, i) => s + (i.n_cols || 0), 0);
        const nAds = yearIssues.reduce((s, i) => s + (i.n_ads || 0), 0);
        const issueWord = nIssues === 1 ? 'issue' : 'issues';
        const cards = yearIssues.map(issue => {
            const date = `${issue.year}-${String(issue.month).padStart(2,'0')}-${String(issue.day).padStart(2,'0')}`;
            const lastRan = issue.last_ran ? new Date(issue.last_ran + 'Z').toLocaleString() : '';
            return `<div class="issue-card" onclick="showIssue('${issue.dir}')">
                ${renderPassBadges(issue.dir)}
                <h2>${date}</h2>
                <div class="stats">
                    ${issue.n_pages || 0} pages \u2022
                    ${issue.n_cols || 0} columns \u2022
                    ${issue.n_ads || 0} ads
                    ${lastRan ? '\u2022 ran ' + lastRan : ''}
                </div>
            </div>`;
        }).join('');
        const threshold = YEAR_PROGRESS_THRESHOLDS[year] ?? 40;
        const wellProgressed = nIssues >= threshold ? ' well-progressed' : '';
        parts.push(`<details class="year-block${wellProgressed}" data-decade="${decade}" data-year="${year}">
            <summary>${year} \u2014 ${nIssues} ${issueWord}, ${nCols} columns, ${nAds} ads</summary>
            <div class="year-content">${cards}</div>
        </details>`);
    }
    el.innerHTML = parts.join('');
}

function setDecadeYearsOpen(decade, open) {
    document.querySelectorAll(
        `details.year-block[data-decade="${decade}"]`
    ).forEach(d => { d.open = open; });
}

function setAllYearsOpen(open) {
    document.querySelectorAll('details.year-block').forEach(d => {
        d.open = open;
    });
}

// Lazy detail rendering — replaces the eager `renderDetails(issues)`
// pass that used to build a hidden detail-panel for every issue at
// load time. With per-issue files we fetch + render only the panel
// the user actually opens, then memoise it. Initial DOM stays small
// and the per-issue JSON only loads on first expand.
function renderOneIssueDetail(issue) {
    const date = `${issue.year}-${String(issue.month).padStart(2,'0')}-${String(issue.day).padStart(2,'0')}`;
    const idx = indexIssues.findIndex(i => i.dir === issue.dir);
    const prev = idx > 0 ? indexIssues[idx - 1] : null;
    const next = idx >= 0 && idx < indexIssues.length - 1 ? indexIssues[idx + 1] : null;
    const fmtDate = i => `${i.year}-${String(i.month).padStart(2,'0')}-${String(i.day).padStart(2,'0')}`;
    const prevLink = prev
        ? `<a onclick="gotoIssue('${issue.dir}','${prev.dir}')">\u2190 ${fmtDate(prev)}</a>`
        : `<span class="placeholder">\u2190 (first issue)</span>`;
    const nextLink = next
        ? `<a onclick="gotoIssue('${issue.dir}','${next.dir}')">${fmtDate(next)} \u2192</a>`
        : `<span class="placeholder">(last issue) \u2192</span>`;

    const pagesHtml = (issue.pages || []).map(pg => {
        const widths = (pg.widths || []).map(w => Math.round(w) + '%').join(' ');
        const conf = pg.confidence ? `conf=${pg.confidence}` : '';
        const flags = (pg.flags || [])
            .filter(f => f.includes('anchor') || f.includes('prior') || f.includes('sliver'))
            .map(f => `<span class="flag">${f}</span>`).join('');

        const url = `${BASE}/${issue.dir}/p${pg.page}/page_display.avif`;
        const viewerUrl = `page_viewer.html?issue=${issue.dir}&page=${pg.page}`;
        const overlayHtml = `<a href="${viewerUrl}" target="_blank"><img class="thumb thumb-wide" src="${url}" loading="lazy" onerror="retryImg(this)"></a>
            <a href="${viewerUrl}" target="_blank" style="display:inline-block;margin-left:8px;font-size:0.8em;color:#4488ff;text-decoration:none">Open inspector \u2192</a>`;

        const colsHtml = (pg.col_files || []).map(cf => {
            const url = `${BASE}/${issue.dir}/p${pg.page}/${cf}`;
            return `<a href="${url}" target="_blank"><img class="thumb" src="${url}" loading="lazy" onerror="retryImg(this)"></a>`;
        }).join('');

        return `<details>
            <summary>Page ${pg.page} (${pg.page_type}) \u2014 ${pg.num_columns} cols [${widths}] ${conf} ${flags}</summary>
            <div class="page-content">
                ${overlayHtml}
                <div class="cols-row" style="margin-top:8px">${colsHtml}</div>
            </div>
        </details>`;
    }).join('');

    let adsHtml = '';
    const ads = issue.ads || [];
    if (ads.length > 0) {
        const adThumbs = ads.map(ad => {
            const url = `${BASE}/${issue.dir}/ads/p${ad.page}/${ad.file}`;
            return `<a href="${url}" target="_blank"><img class="thumb" src="${url}" loading="lazy" onerror="retryImg(this)"></a>`;
        }).join('');
        adsHtml = `<details class="ads-section">
            <summary>Display Ads (${ads.length})</summary>
            <div class="page-content"><div class="thumb-row">${adThumbs}</div></div>
        </details>`;
    }

    const ts = transcribeStatus[issue.dir];
    const iiifBtn = (ts && ts.manifest_dir)
        ? `<a class="back-btn iiif-btn" href="preview/iiif/mirador.html?issue=${issue.dir}" target="_blank">Transcripts (IIIF) \u2192</a>`
        : '';

    return `<div class="issue-detail" id="detail-${issue.dir}">
        <div class="detail-header">
            <div class="detail-header-left">
                <a class="back-btn" onclick="hideIssue('${issue.dir}')">\u2190 Back to list</a>
                <a class="back-btn inspector-btn" href="page_viewer.html?issue=${issue.dir}&page=1" target="_blank">Inspector \u2192</a>
                ${iiifBtn}
            </div>
            <span class="expand-ctrl">
                <a onclick="setAllDetails('${issue.dir}', true)">open all</a>
                |
                <a onclick="setAllDetails('${issue.dir}', false)">close all</a>
            </span>
        </div>
        <div class="detail-title"><h2>${date}</h2>${renderPassBadges(issue.dir)}</div>
        <p class="stats" style="margin-bottom:15px">
            ${issue.n_cols || 0} columns \u2022
            ${ads.length} ads
        </p>
        ${pagesHtml}
        ${adsHtml}
        <div class="issue-nav">${prevLink}${nextLink}</div>
    </div>`;
}

// Ensure a detail panel exists for `dir`. Fetches the per-issue JSON
// the first time and inserts the rendered DOM. Idempotent — repeated
// calls are no-ops once mounted.
async function ensureDetailMounted(dir) {
    if (document.getElementById('detail-' + dir)) return;
    const issue = await loadIssue(dir);
    const tmp = document.createElement('div');
    tmp.innerHTML = renderOneIssueDetail(issue);
    document.getElementById('details-container').appendChild(tmp.firstElementChild);
}

function renderDecadeNav(issues) {
    // Show every decade that the corpus span touches so unprocessed
    // decades are still clickable jump-targets. Issues param kept for
    // signature compatibility but we derive the range from the
    // CORPUS_*_YEAR constants.
    const startDecade = Math.floor(CORPUS_START_YEAR / 10) * 10;
    const endDecade = Math.floor(CORPUS_END_YEAR / 10) * 10;
    const decades = [];
    for (let d = startDecade; d <= endDecade; d += 10) decades.push(d);
    document.getElementById('decade-nav').innerHTML = decades.map(d =>
        `<a href="#decade-${d}" onclick="gotoDecade(${d}, event)">${d}</a>`
    ).join('');
    setupActiveDecadeTracking(decades);
}

/*
 * Active-decade tracking: as the user scrolls the issue list, mark
 * the latest decade marker we've scrolled past with `.active` on its
 * nav link (visual: black underline). Only runs while the list view
 * is showing — when an issue detail is open the list is hidden and
 * decade markers don't apply.
 */
function setupActiveDecadeTracking(decades) {
    const nav = document.getElementById('decade-nav');
    const links = {};
    for (const d of decades) {
        const a = nav.querySelector(`a[href="#decade-${d}"]`);
        if (a) links[d] = a;
    }
    const header = document.getElementById('page-header');
    let currentActive = null;

    function update() {
        // Skip while a detail is showing — list is hidden and markers
        // are not in the visual flow the user is looking at.
        const list = document.getElementById('issue-list');
        if (list && list.style.display === 'none') return;

        const headerBottom = header.getBoundingClientRect().bottom;
        let active = decades[0];
        for (const d of decades) {
            const el = document.getElementById('decade-' + d);
            if (!el) continue;
            const top = el.getBoundingClientRect().top;
            if (top <= headerBottom + 10) active = d;
            else break;
        }
        if (active === currentActive) return;
        currentActive = active;
        for (const d of decades) {
            if (links[d]) links[d].classList.toggle('active', d === active);
        }
    }

    let scheduled = false;
    function onScroll() {
        if (scheduled) return;
        scheduled = true;
        requestAnimationFrame(() => { scheduled = false; update(); });
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    update();
}

function gotoDecade(decade, ev) {
    if (ev) ev.preventDefault();
    // Close any active detail and restore the list before scrolling
    document.querySelectorAll('.issue-detail.active').forEach(d => d.classList.remove('active'));
    document.getElementById('issue-list').style.display = 'grid';
    history.replaceState(null, '', window.location.pathname);
    const target = document.getElementById('decade-' + decade);
    if (target) target.scrollIntoView({behavior: 'smooth', block: 'start'});
}

// Open the year-block <details> that contains `dir` so that when the
// user closes the issue detail they see the card they came from
// rather than a collapsed list.
function openYearForIssue(dir) {
    const issue = indexByDir.get(dir);
    if (!issue) return;
    const yearEl = document.querySelector(
        `details.year-block[data-year="${issue.year}"]`);
    if (yearEl) yearEl.open = true;
}

async function showIssue(name) {
    document.getElementById('issue-list').style.display = 'none';
    history.replaceState(null, '', '?issue=' + name);
    window.scrollTo(0, 0);
    openYearForIssue(name);
    await ensureDetailMounted(name);
    const el = document.getElementById('detail-' + name);
    if (el) el.classList.add('active');
}
function hideIssue(name) {
    const el = document.getElementById('detail-' + name);
    if (el) el.classList.remove('active');
    document.getElementById('issue-list').style.display = 'grid';
    history.replaceState(null, '', window.location.pathname);
}
async function gotoIssue(from, to) {
    const fromEl = document.getElementById('detail-' + from);
    if (fromEl) fromEl.classList.remove('active');
    history.replaceState(null, '', '?issue=' + to);
    window.scrollTo(0, 0);
    openYearForIssue(to);
    await ensureDetailMounted(to);
    const toEl = document.getElementById('detail-' + to);
    if (toEl) toEl.classList.add('active');
}
function setAllDetails(name, open) {
    document.querySelectorAll('#detail-' + name + ' details').forEach(d => {
        d.open = open;
    });
}

// Retry images that fail to load (mobile browsers don't auto-retry transient failures).
// Up to 3 attempts with exponential backoff and a cache-buster so any cached 4xx is bypassed.
function retryImg(img) {
    // First failure on a page_display.avif: assume the issue is
    // pre-un-gate (no AVIF on disk) and fall back to page_raw.png. For
    // pre-un-gate issues page_raw.png is RGB at ~150 DPI and browser-safe.
    // Un-gate-era issues are expected to have page_display.avif backfilled.
    if (img.src.endsWith('page_display.avif') && !img.dataset.fellBack) {
        img.dataset.fellBack = '1';
        img.src = img.src.replace('page_display.avif', 'page_raw.png');
        return;
    }
    const tries = parseInt(img.dataset.retryTries || '0', 10);
    if (tries >= 3) return;
    img.dataset.retryTries = tries + 1;
    const base = (img.dataset.retryBase ||= img.src.split('?')[0]);
    setTimeout(() => {
        img.src = base + '?r=' + Date.now();
    }, 400 * Math.pow(2, tries));  // 400ms, 800ms, 1600ms
}

async function applyDeepLink() {
    const params = new URLSearchParams(window.location.search);
    const issue = params.get('issue');
    if (issue && indexByDir.has(issue)) {
        document.getElementById('issue-list').style.display = 'none';
        openYearForIssue(issue);
        await ensureDetailMounted(issue);
        const el = document.getElementById('detail-' + issue);
        if (el) el.classList.add('active');
    }
}

(async () => { await init(); await applyDeepLink(); })();
