<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Almonte Gazette — Processed Issues</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, system-ui, sans-serif; background: #f5f5f0; color: #333; padding: 20px; }
h1 { font-size: 1.8em; margin-bottom: 5px; }
.subtitle { color: #666; margin-bottom: 20px; }
.issue-list { display: grid; gap: 15px; margin-bottom: 30px; }
.issue-card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 15px; cursor: pointer; }
.issue-card:hover { border-color: #999; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.issue-card h2 { font-size: 1.2em; margin-bottom: 5px; }
.issue-card .stats { color: #666; font-size: 0.9em; }
.issue-detail { display: none; background: white; border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin-bottom: 30px; }
.issue-detail.active { display: block; }
.back-btn { display: inline-block; margin-bottom: 15px; padding: 5px 12px; background: #eee; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; text-decoration: none; color: #333; }
.thumb { max-width: 120px; border: 1px solid #ddd; border-radius: 4px; }
.thumb-wide { max-width: 300px; }
.thumb-row { display: flex; flex-wrap: wrap; gap: 8px; }
.cols-row { display: flex; flex-wrap: nowrap; gap: 6px; align-items: flex-start; width: 100%; }
.cols-row a { flex: 1 1 0; min-width: 0; display: block; }
.cols-row img { width: 100%; height: auto; max-width: none; display: block; }
.cols-row a:hover img { transform: none; }
.flag { display: inline-block; background: #fff3cd; color: #856404; font-size: 0.75em; padding: 1px 6px; border-radius: 3px; margin-right: 4px; }
.detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.expand-ctrl { font-size: 0.85em; color: #4488ff; }
.expand-ctrl a { color: #4488ff; cursor: pointer; text-decoration: none; }
.expand-ctrl a:hover { text-decoration: underline; }
.issue-nav { margin-top: 20px; padding-top: 12px; border-top: 1px solid #eee; display: flex; justify-content: space-between; font-size: 0.9em; }
.issue-nav a { color: #4488ff; text-decoration: none; cursor: pointer; }
.issue-nav a:hover { text-decoration: underline; }
.issue-nav .placeholder { color: #ccc; }
a img { transition: transform 0.15s; }
a img:hover { transform: scale(1.05); }
details { margin-bottom: 10px; border: 1px solid #eee; border-radius: 6px; }
details[open] { padding-bottom: 10px; }
details summary { padding: 10px 15px; cursor: pointer; font-weight: 500; background: #fafaf8; border-radius: 6px; }
details summary:hover { background: #f0f0ea; }
details[open] summary { border-bottom: 1px solid #eee; border-radius: 6px 6px 0 0; }
.page-content { padding: 10px 15px; }
details.ads-section summary { background: #f8f5ee; }
#loading { color: #999; font-style: italic; }
.totals { color: #666; font-size: 0.9em; margin-bottom: 15px; }
</style>
</head>
<body>
<h1>Almonte Gazette</h1>
<p class="subtitle">Processed Issues — Column Extraction Pipeline</p>
<div id="totals" class="totals"></div>
<div id="loading">Loading data...</div>
<div id="issue-list" class="issue-list"></div>
<div id="details-container"></div>

<script>
const BASE = '/MVTM/columns';

async function init() {
    try {
        const resp = await fetch(BASE + '/viewer_data.json');
        const data = await resp.json();
        const issues = data.issues || data;  // handle both formats
        document.getElementById('loading').style.display = 'none';
        renderList(issues);
        renderDetails(issues);
        const totalCols = issues.reduce((s, i) => s + i.n_cols, 0);
        const totalAds = data.total_ads || issues.reduce((s, i) => s + i.n_ads, 0);
        const totalPages = data.total_gazette_pages || 0;
        const processed = data.total_processed || 0;
        const pct = data.pct_done || 0;
        const statsLine = totalPages > 0
            ? `${processed} of ${totalPages.toLocaleString()} pages processed (${pct}%) \u2022 ${issues.length} issues \u2022 ${totalCols} columns \u2022 ${totalAds} ads`
            : `${issues.length} issues \u2022 ${totalCols} columns \u2022 ${totalAds} ads`;
        document.getElementById('totals').textContent = statsLine;
    } catch (e) {
        document.getElementById('loading').textContent = 'Failed to load data: ' + e.message;
    }
}

function renderList(issues) {
    const el = document.getElementById('issue-list');
    el.innerHTML = issues.map(issue => {
        const date = `${issue.year}-${String(issue.month).padStart(2,'0')}-${String(issue.day).padStart(2,'0')}`;
        const lastRan = issue.last_ran ? new Date(issue.last_ran + 'Z').toLocaleString() : '';
        return `<div class="issue-card" onclick="showIssue('${issue.dir}')">
            <h2>${date}</h2>
            <div class="stats">
                ${issue.n_pages} pages \u2022
                ${issue.n_cols} columns \u2022
                ${issue.n_ads} ads
                ${lastRan ? '\u2022 ran ' + lastRan : ''}
            </div>
        </div>`;
    }).join('');
}

function renderDetails(issues) {
    const container = document.getElementById('details-container');
    container.innerHTML = issues.map((issue, idx) => {
        const date = `${issue.year}-${String(issue.month).padStart(2,'0')}-${String(issue.day).padStart(2,'0')}`;
        const prev = issues[idx - 1];
        const next = issues[idx + 1];
        const fmtDate = i => `${i.year}-${String(i.month).padStart(2,'0')}-${String(i.day).padStart(2,'0')}`;
        const prevLink = prev
            ? `<a onclick="gotoIssue('${issue.dir}','${prev.dir}')">\u2190 ${fmtDate(prev)}</a>`
            : `<span class="placeholder">\u2190 (first issue)</span>`;
        const nextLink = next
            ? `<a onclick="gotoIssue('${issue.dir}','${next.dir}')">${fmtDate(next)} \u2192</a>`
            : `<span class="placeholder">(last issue) \u2192</span>`;

        const pagesHtml = issue.pages.map(pg => {
            const widths = pg.widths.map(w => Math.round(w) + '%').join(' ');
            const conf = pg.confidence ? `conf=${pg.confidence}` : '';
            const flags = (pg.flags || [])
                .filter(f => f.includes('anchor') || f.includes('prior') || f.includes('sliver'))
                .map(f => `<span class="flag">${f}</span>`).join('');

            const url = `${BASE}/${issue.dir}/p${pg.page}/page_raw.png`;
            const viewerUrl = `page_viewer.html?issue=${issue.dir}&page=${pg.page}`;
            const overlayHtml = `<a href="${viewerUrl}" target="_blank"><img class="thumb thumb-wide" src="${url}" loading="lazy"></a>
                <a href="${viewerUrl}" target="_blank" style="display:inline-block;margin-left:8px;font-size:0.8em;color:#4488ff;text-decoration:none">Open inspector →</a>`;

            const colsHtml = pg.col_files.map(cf => {
                const url = `${BASE}/${issue.dir}/p${pg.page}/${cf}`;
                return `<a href="${url}" target="_blank"><img class="thumb" src="${url}" loading="lazy"></a>`;
            }).join('');

            return `<details>
                <summary>Page ${pg.page} (${pg.page_type}) \u2014 ${pg.num_columns} cols [${widths}] ${conf} ${flags}</summary>
                <div class="page-content">
                    ${overlayHtml}
                    <div class="cols-row" style="margin-top:8px">${colsHtml}</div>
                </div>
            </details>`;
        }).join('');

        let adsHtml = '';
        if (issue.ads.length > 0) {
            const adThumbs = issue.ads.map(ad => {
                const url = `${BASE}/${issue.dir}/ads/p${ad.page}/${ad.file}`;
                return `<a href="${url}" target="_blank"><img class="thumb" src="${url}" loading="lazy"></a>`;
            }).join('');
            adsHtml = `<details class="ads-section">
                <summary>Display Ads (${issue.ads.length})</summary>
                <div class="page-content"><div class="thumb-row">${adThumbs}</div></div>
            </details>`;
        }

        return `<div class="issue-detail" id="detail-${issue.dir}">
            <div class="detail-header">
                <a class="back-btn" onclick="hideIssue('${issue.dir}')">\u2190 Back to list</a>
                <span class="expand-ctrl">
                    <a onclick="setAllDetails('${issue.dir}', true)">open all</a>
                    |
                    <a onclick="setAllDetails('${issue.dir}', false)">close all</a>
                </span>
            </div>
            <h2>${date}</h2>
            <p class="stats" style="margin-bottom:15px">
                ${issue.n_cols} columns \u2022
                ${issue.n_ads} ads
            </p>
            ${pagesHtml}
            ${adsHtml}
            <div class="issue-nav">${prevLink}${nextLink}</div>
        </div>`;
    }).join('');
}

function showIssue(name) {
    document.getElementById('issue-list').style.display = 'none';
    document.getElementById('detail-' + name).classList.add('active');
    history.replaceState(null, '', '?issue=' + name);
    window.scrollTo(0, 0);
}
function hideIssue(name) {
    document.getElementById('detail-' + name).classList.remove('active');
    document.getElementById('issue-list').style.display = 'grid';
    history.replaceState(null, '', window.location.pathname);
}
function gotoIssue(from, to) {
    document.getElementById('detail-' + from).classList.remove('active');
    document.getElementById('detail-' + to).classList.add('active');
    history.replaceState(null, '', '?issue=' + to);
    window.scrollTo(0, 0);
}
function setAllDetails(name, open) {
    document.querySelectorAll('#detail-' + name + ' details').forEach(d => {
        d.open = open;
    });
}

function applyDeepLink() {
    const params = new URLSearchParams(window.location.search);
    const issue = params.get('issue');
    if (issue) {
        const el = document.getElementById('detail-' + issue);
        if (el) {
            document.getElementById('issue-list').style.display = 'none';
            el.classList.add('active');
        }
    }
}

(async () => { await init(); applyDeepLink(); })();
</script>
</body>
</html>
