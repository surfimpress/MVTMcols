<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Almonte Gazette — Processed Issues</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-padding-top: 120px; }
body { font-family: -apple-system, system-ui, sans-serif; background: #f5f5f0; color: #333; padding: 0 20px 20px; }
#page-header { position: sticky; top: 0; background: #f5f5f0; padding: 14px 20px 10px; margin: 0 -20px 14px; z-index: 10; border-bottom: 1px solid #ddd; }
#page-header h1 { margin-bottom: 8px; }
#decade-nav { display: flex; gap: 4px; flex-wrap: wrap; }
#decade-nav a { color: #4488ff; text-decoration: none; padding: 4px 10px; border-radius: 4px; font-size: 0.95em; cursor: pointer; }
#decade-nav a:hover { background: #e8e8e0; text-decoration: underline; }
.decade-header { font-size: 1.1em; color: #555; margin-top: 6px; padding-top: 12px; border-top: 1px solid #ddd; }
.decade-header:first-child { border-top: none; padding-top: 0; margin-top: 0; }
h1 { font-size: 1.8em; margin-bottom: 5px; }
.subtitle { color: #666; margin-bottom: 20px; }
.issue-list { display: grid; gap: 15px; margin-bottom: 30px; }
.issue-card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 15px; cursor: pointer; }
.issue-card:hover { border-color: #999; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.issue-card h2 { font-size: 1.2em; margin-bottom: 5px; }
.issue-card .stats { color: #666; font-size: 0.9em; }
.issue-detail { display: none; background: white; border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin-bottom: 30px; }
.issue-detail.active { display: block; }
.back-btn { display: inline-block; margin-bottom: 15px; padding: 5px 12px; background: #eee; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; text-decoration: none; color: #333; }
.thumb { max-width: 120px; border: 1px solid #ddd; border-radius: 4px; }
.thumb-wide { max-width: 300px; }
.thumb-row { display: flex; flex-wrap: wrap; gap: 8px; }
.cols-row { display: flex; flex-wrap: nowrap; gap: 6px; align-items: flex-start; width: 100%; }
.cols-row a { flex: 1 1 0; min-width: 0; display: block; }
.cols-row img { width: 100%; height: auto; max-width: none; display: block; }
.cols-row a:hover img { transform: none; }
.flag { display: inline-block; background: #fff3cd; color: #856404; font-size: 0.75em; padding: 1px 6px; border-radius: 3px; margin-right: 4px; }
.detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.detail-header-left { display: flex; align-items: center; gap: 30px; }
.inspector-btn { background: #4488ff; color: white; border-color: #2266dd; }
.inspector-btn:hover { background: #5599ff; color: white; }
.expand-ctrl { font-size: 0.85em; color: #4488ff; }
.expand-ctrl a { color: #4488ff; cursor: pointer; text-decoration: none; }
.expand-ctrl a:hover { text-decoration: underline; }
.issue-nav { margin-top: 20px; padding-top: 12px; border-top: 1px solid #eee; display: flex; justify-content: space-between; font-size: 0.9em; }
.issue-nav a { color: #4488ff; text-decoration: none; cursor: pointer; }
.issue-nav a:hover { text-decoration: underline; }
.issue-nav .placeholder { color: #ccc; }
a img { transition: transform 0.15s; }
a img:hover { transform: scale(1.05); }
details { margin-bottom: 10px; border: 1px solid #eee; border-radius: 6px; }
details[open] { padding-bottom: 10px; }
details summary { padding: 10px 15px; cursor: pointer; font-weight: 500; background: #fafaf8; border-radius: 6px; }
details summary:hover { background: #f0f0ea; }
details[open] summary { border-bottom: 1px solid #eee; border-radius: 6px 6px 0 0; }
.page-content { padding: 10px 15px; }
details.ads-section summary { background: #f8f5ee; }
#loading { color: #999; font-style: italic; }
.totals { color: #666; font-size: 0.9em; margin-bottom: 15px; }
</style>
</head>
<body>
<header id="page-header">
<h1>Almonte Gazette</h1>
<nav id="decade-nav"></nav>
</header>
<p class="subtitle">Processed Issues — Column Extraction Pipeline</p>
<div id="totals" class="totals"></div>
<div id="loading">Loading data...</div>
<div id="issue-list" class="issue-list"></div>
<div id="details-container"></div>

<script>
const BASE = '/MVTM/columns';

// Caching strategy:
// Plain `fetch(url)` with no cache-busting query string and no
// `cache: 'no-store'` directive. The browser keeps each JSON in its
// HTTP cache and asks the server `If-Modified-Since` on the next
// load — which returns 304 (use cached) for unchanged files and 200
// (fresh body) for changed files. Server-side, every JSON we write
// uses `os.replace(tmp, path)`, which updates the file mtime — so
// `Last-Modified` on the response is the source of truth. No client-
// side TTL guesswork; the network handles it.
//
// Index is small (~60KB at 430 issues). Per-issue files are tiny
// (2-40KB each) and fetched on demand only when the user expands
// the issue. Once cached they're free until that issue is reprocessed.

// In-memory cache of per-issue payloads we've already fetched.
const issueCache = new Map();
// Index issues, populated from index.json — keyed by `dir` for lookup.
let indexIssues = [];
const indexByDir = new Map();

async function init() {
    try {
        const resp = await fetch(BASE + '/index.json');
        const data = await resp.json();
        indexIssues = data.issues || [];
        for (const i of indexIssues) indexByDir.set(i.dir, i);

        document.getElementById('loading').style.display = 'none';
        renderList(indexIssues);
        renderDecadeNav(indexIssues);

        const totalCols = indexIssues.reduce((s, i) => s + (i.n_cols || 0), 0);
        const totalAds = data.total_ads
            ?? indexIssues.reduce((s, i) => s + (i.n_ads || 0), 0);
        const totalPages = data.total_gazette_pages || 0;
        const processed = data.total_processed || 0;
        const pct = data.pct_done || 0;
        const statsLine = totalPages > 0
            ? `${processed} of ${totalPages.toLocaleString()} pages processed (${pct}%) \u2022 ${indexIssues.length} issues \u2022 ${totalCols} columns \u2022 ${totalAds} ads`
            : `${indexIssues.length} issues \u2022 ${totalCols} columns \u2022 ${totalAds} ads`;
        document.getElementById('totals').textContent = statsLine;
    } catch (e) {
        document.getElementById('loading').textContent = 'Failed to load data: ' + e.message;
    }
}

// Fetch one issue's full payload (pages + ads). Plain fetch — HTTP
// cache + If-Modified-Since handles staleness.
async function loadIssue(dir) {
    if (issueCache.has(dir)) return issueCache.get(dir);
    const resp = await fetch(`${BASE}/issues/${dir}.json`);
    if (!resp.ok) throw new Error(`Failed to load ${dir}: ${resp.status}`);
    const payload = await resp.json();
    issueCache.set(dir, payload);
    return payload;
}

function renderList(issues) {
    const el = document.getElementById('issue-list');
    let lastDecade = null;
    el.innerHTML = issues.map(issue => {
        const decade = Math.floor(issue.year / 10) * 10;
        let prefix = '';
        if (decade !== lastDecade) {
            lastDecade = decade;
            prefix = `<h3 class="decade-header" id="decade-${decade}">${decade}</h3>`;
        }
        const date = `${issue.year}-${String(issue.month).padStart(2,'0')}-${String(issue.day).padStart(2,'0')}`;
        const lastRan = issue.last_ran ? new Date(issue.last_ran + 'Z').toLocaleString() : '';
        return prefix + `<div class="issue-card" onclick="showIssue('${issue.dir}')">
            <h2>${date}</h2>
            <div class="stats">
                ${issue.n_pages || 0} pages \u2022
                ${issue.n_cols || 0} columns \u2022
                ${issue.n_ads || 0} ads
                ${lastRan ? '\u2022 ran ' + lastRan : ''}
            </div>
        </div>`;
    }).join('');
}

// Lazy detail rendering — replaces the eager `renderDetails(issues)`
// pass that used to build a hidden detail-panel for every issue at
// load time. With per-issue files we fetch + render only the panel
// the user actually opens, then memoise it. Initial DOM stays small
// and the per-issue JSON only loads on first expand.
function renderOneIssueDetail(issue) {
    const date = `${issue.year}-${String(issue.month).padStart(2,'0')}-${String(issue.day).padStart(2,'0')}`;
    const idx = indexIssues.findIndex(i => i.dir === issue.dir);
    const prev = idx > 0 ? indexIssues[idx - 1] : null;
    const next = idx >= 0 && idx < indexIssues.length - 1 ? indexIssues[idx + 1] : null;
    const fmtDate = i => `${i.year}-${String(i.month).padStart(2,'0')}-${String(i.day).padStart(2,'0')}`;
    const prevLink = prev
        ? `<a onclick="gotoIssue('${issue.dir}','${prev.dir}')">\u2190 ${fmtDate(prev)}</a>`
        : `<span class="placeholder">\u2190 (first issue)</span>`;
    const nextLink = next
        ? `<a onclick="gotoIssue('${issue.dir}','${next.dir}')">${fmtDate(next)} \u2192</a>`
        : `<span class="placeholder">(last issue) \u2192</span>`;

    const pagesHtml = (issue.pages || []).map(pg => {
        const widths = (pg.widths || []).map(w => Math.round(w) + '%').join(' ');
        const conf = pg.confidence ? `conf=${pg.confidence}` : '';
        const flags = (pg.flags || [])
            .filter(f => f.includes('anchor') || f.includes('prior') || f.includes('sliver'))
            .map(f => `<span class="flag">${f}</span>`).join('');

        const url = `${BASE}/${issue.dir}/p${pg.page}/page_raw.png`;
        const viewerUrl = `page_viewer.html?issue=${issue.dir}&page=${pg.page}`;
        const overlayHtml = `<a href="${viewerUrl}" target="_blank"><img class="thumb thumb-wide" src="${url}" loading="lazy" onerror="retryImg(this)"></a>
            <a href="${viewerUrl}" target="_blank" style="display:inline-block;margin-left:8px;font-size:0.8em;color:#4488ff;text-decoration:none">Open inspector \u2192</a>`;

        const colsHtml = (pg.col_files || []).map(cf => {
            const url = `${BASE}/${issue.dir}/p${pg.page}/${cf}`;
            return `<a href="${url}" target="_blank"><img class="thumb" src="${url}" loading="lazy" onerror="retryImg(this)"></a>`;
        }).join('');

        return `<details>
            <summary>Page ${pg.page} (${pg.page_type}) \u2014 ${pg.num_columns} cols [${widths}] ${conf} ${flags}</summary>
            <div class="page-content">
                ${overlayHtml}
                <div class="cols-row" style="margin-top:8px">${colsHtml}</div>
            </div>
        </details>`;
    }).join('');

    let adsHtml = '';
    const ads = issue.ads || [];
    if (ads.length > 0) {
        const adThumbs = ads.map(ad => {
            const url = `${BASE}/${issue.dir}/ads/p${ad.page}/${ad.file}`;
            return `<a href="${url}" target="_blank"><img class="thumb" src="${url}" loading="lazy" onerror="retryImg(this)"></a>`;
        }).join('');
        adsHtml = `<details class="ads-section">
            <summary>Display Ads (${ads.length})</summary>
            <div class="page-content"><div class="thumb-row">${adThumbs}</div></div>
        </details>`;
    }

    return `<div class="issue-detail" id="detail-${issue.dir}">
        <div class="detail-header">
            <div class="detail-header-left">
                <a class="back-btn" onclick="hideIssue('${issue.dir}')">\u2190 Back to list</a>
                <a class="back-btn inspector-btn" href="page_viewer.html?issue=${issue.dir}&page=1" target="_blank">Inspector \u2192</a>
            </div>
            <span class="expand-ctrl">
                <a onclick="setAllDetails('${issue.dir}', true)">open all</a>
                |
                <a onclick="setAllDetails('${issue.dir}', false)">close all</a>
            </span>
        </div>
        <h2>${date}</h2>
        <p class="stats" style="margin-bottom:15px">
            ${issue.n_cols || 0} columns \u2022
            ${ads.length} ads
        </p>
        ${pagesHtml}
        ${adsHtml}
        <div class="issue-nav">${prevLink}${nextLink}</div>
    </div>`;
}

// Ensure a detail panel exists for `dir`. Fetches the per-issue JSON
// the first time and inserts the rendered DOM. Idempotent — repeated
// calls are no-ops once mounted.
async function ensureDetailMounted(dir) {
    if (document.getElementById('detail-' + dir)) return;
    const issue = await loadIssue(dir);
    const tmp = document.createElement('div');
    tmp.innerHTML = renderOneIssueDetail(issue);
    document.getElementById('details-container').appendChild(tmp.firstElementChild);
}

function renderDecadeNav(issues) {
    const decades = [...new Set(issues.map(i => Math.floor(i.year / 10) * 10))].sort((a, b) => a - b);
    document.getElementById('decade-nav').innerHTML = decades.map(d =>
        `<a href="#decade-${d}" onclick="gotoDecade(${d}, event)">${d}</a>`
    ).join('');
}

function gotoDecade(decade, ev) {
    if (ev) ev.preventDefault();
    // Close any active detail and restore the list before scrolling
    document.querySelectorAll('.issue-detail.active').forEach(d => d.classList.remove('active'));
    document.getElementById('issue-list').style.display = 'grid';
    history.replaceState(null, '', window.location.pathname);
    const target = document.getElementById('decade-' + decade);
    if (target) target.scrollIntoView({behavior: 'smooth', block: 'start'});
}

async function showIssue(name) {
    document.getElementById('issue-list').style.display = 'none';
    history.replaceState(null, '', '?issue=' + name);
    window.scrollTo(0, 0);
    await ensureDetailMounted(name);
    const el = document.getElementById('detail-' + name);
    if (el) el.classList.add('active');
}
function hideIssue(name) {
    const el = document.getElementById('detail-' + name);
    if (el) el.classList.remove('active');
    document.getElementById('issue-list').style.display = 'grid';
    history.replaceState(null, '', window.location.pathname);
}
async function gotoIssue(from, to) {
    const fromEl = document.getElementById('detail-' + from);
    if (fromEl) fromEl.classList.remove('active');
    history.replaceState(null, '', '?issue=' + to);
    window.scrollTo(0, 0);
    await ensureDetailMounted(to);
    const toEl = document.getElementById('detail-' + to);
    if (toEl) toEl.classList.add('active');
}
function setAllDetails(name, open) {
    document.querySelectorAll('#detail-' + name + ' details').forEach(d => {
        d.open = open;
    });
}

// Retry images that fail to load (mobile browsers don't auto-retry transient failures).
// Up to 3 attempts with exponential backoff and a cache-buster so any cached 4xx is bypassed.
function retryImg(img) {
    const tries = parseInt(img.dataset.retryTries || '0', 10);
    if (tries >= 3) return;
    img.dataset.retryTries = tries + 1;
    const base = (img.dataset.retryBase ||= img.src.split('?')[0]);
    setTimeout(() => {
        img.src = base + '?r=' + Date.now();
    }, 400 * Math.pow(2, tries));  // 400ms, 800ms, 1600ms
}

async function applyDeepLink() {
    const params = new URLSearchParams(window.location.search);
    const issue = params.get('issue');
    if (issue && indexByDir.has(issue)) {
        document.getElementById('issue-list').style.display = 'none';
        await ensureDetailMounted(issue);
        const el = document.getElementById('detail-' + issue);
        if (el) el.classList.add('active');
    }
}

(async () => { await init(); await applyDeepLink(); })();
</script>
</body>
</html>
