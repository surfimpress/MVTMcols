<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Terminology Review</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e0e0e0;
    --row-alt: #f7f7f7;
    --accent: #2b6cb0;
    --warn: #d9822b;
    --code-bg: #f2f2f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a;
      --fg: #e8e8e8;
      --muted: #9a9a9a;
      --border: #2c2f33;
      --row-alt: #1b1e21;
      --accent: #5b9bd5;
      --warn: #e6a45c;
      --code-bg: #1f2326;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.5rem;
    background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 1000px; margin-inline: auto;
  }
  h1 { font-size: 1.3rem; margin: 0 0 0.2rem; }
  .sub { color: var(--muted); font-size: 0.85rem; margin: 0 0 1.25rem; }
  .controls { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1.1rem; align-items: center; }
  .chip {
    padding: 0.35rem 0.7rem; border-radius: 999px; border: 1px solid var(--border);
    background: var(--bg); color: var(--muted); font-size: 0.8rem; cursor: pointer;
  }
  .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .count { color: var(--muted); font-size: 0.82rem; margin-bottom: 0.8rem; }
  .card {
    border: 1px solid var(--border); border-radius: 8px; padding: 0.8rem 1rem;
    margin-bottom: 0.7rem; background: var(--row-alt);
  }
  .card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; }
  .kind-tag {
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--accent); font-weight: 600;
  }
  .confidence { font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .confidence.low { color: var(--warn); }
  .desc { margin: 0.4rem 0; }
  .cli {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.82rem;
    background: var(--code-bg); border-radius: 6px; padding: 0.5rem 0.7rem;
    overflow-x: auto; white-space: pre; cursor: pointer;
  }
  .cli:hover { outline: 1px solid var(--accent); }
  .meta { font-size: 0.76rem; color: var(--muted); margin-top: 0.4rem; }
  .empty { color: var(--muted); padding: 2rem 0; text-align: center; }
  footer { margin-top: 1.5rem; color: var(--muted); font-size: 0.78rem; }
</style>
</head>
<body>
  <h1>Terminology Review</h1>
  <p class="sub" id="freshness">loading…</p>

  <div class="controls">
    <button class="chip active" data-kind="all">All</button>
    <button class="chip" data-kind="duplicate_candidate">Duplicate candidates</button>
    <button class="chip" data-kind="nomenclature_gap">Nomenclature gaps</button>
    <button class="chip" data-kind="name_too_specific">Name too specific</button>
    <button class="chip" data-kind="type_near_duplicate">Type near-duplicates</button>
  </div>

  <p class="count" id="count"></p>
  <div id="cards"></div>

  <footer>
    Reads terminology_review.json only. Click a command to copy it — nothing
    here applies itself; run the command yourself once you've confirmed the
    finding. Generated by <code>python3 -m transcribe.terminology_cleanup run-all</code>.
  </footer>

<script>
(function() {
  var POLL_MS = 30000;
  var state = { kind: 'all', data: null };

  function fmtAgo(iso) {
    if (!iso) return '—';
    var ms = Date.now() - new Date(iso).getTime();
    var s = Math.round(ms / 1000);
    if (s < 60) return s + 's ago';
    var m = Math.round(s / 60);
    if (m < 60) return m + 'm ago';
    var h = Math.round(m / 60);
    if (h < 48) return h + 'h ago';
    return Math.round(h / 24) + 'd ago';
  }

  function render() {
    if (!state.data) return;
    var rows = state.data.reviews.filter(function(r) { return r.status === 'open'; });
    if (state.kind !== 'all') rows = rows.filter(function(r) { return r.review_kind === state.kind; });
    rows.sort(function(a, b) { return (b.confidence || 0) - (a.confidence || 0); });

    document.getElementById('count').textContent = rows.length + ' open review(s)';

    var container = document.getElementById('cards');
    if (!rows.length) {
      container.innerHTML = '<p class="empty">Nothing open in this category.</p>';
      return;
    }
    container.innerHTML = rows.map(function(r) {
      var conf = r.confidence == null ? '' : r.confidence.toFixed(2);
      var confClass = (r.confidence != null && r.confidence < 0.5) ? 'confidence low' : 'confidence';
      var cliBlock = r.suggested_cli
        ? '<div class="cli" data-cli="' + r.suggested_cli.replace(/"/g, '&quot;') + '">' +
          r.suggested_cli.replace(/</g, '&lt;') + '</div>'
        : '';
      return '<div class="card">' +
        '<div class="card-top">' +
          '<span class="kind-tag">' + r.review_kind.replace(/_/g, ' ') + '</span>' +
          '<span class="' + confClass + '">confidence ' + conf + '</span>' +
        '</div>' +
        '<p class="desc">' + (r.description || '').replace(/</g, '&lt;') + '</p>' +
        cliBlock +
        '<p class="meta">' + r.entity_type + ' · raised ' + fmtAgo(r.raised_at) + ' by ' + r.raised_by + '</p>' +
        '</div>';
    }).join('');

    container.querySelectorAll('.cli').forEach(function(el) {
      el.addEventListener('click', function() {
        navigator.clipboard.writeText(el.dataset.cli).then(function() {
          var prev = el.textContent;
          el.textContent = 'copied to clipboard';
          setTimeout(function() { el.textContent = prev; }, 900);
        });
      });
    });
  }

  function poll() {
    fetch('terminology_review.json?_=' + Date.now())
      .then(function(r) { return r.json(); })
      .then(function(data) {
        state.data = data;
        document.getElementById('freshness').textContent = 'updated ' + fmtAgo(data.generated_at);
        render();
      })
      .catch(function(e) {
        document.getElementById('freshness').textContent = 'failed to load terminology_review.json: ' + e;
      });
  }

  document.querySelectorAll('.chip').forEach(function(chip) {
    chip.addEventListener('click', function() {
      document.querySelectorAll('.chip').forEach(function(c) { c.classList.remove('active'); });
      chip.classList.add('active');
      state.kind = chip.dataset.kind;
      render();
    });
  });

  poll();
  setInterval(poll, POLL_MS);
})();
</script>
</body>
</html>
