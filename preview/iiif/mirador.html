<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MVTM IIIF preview</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #111; }
    #mirador {
      position: absolute;
      top: 64px; left: 0; right: 0; bottom: 0;
    }
    .topbar {
      position: absolute; top: 0; left: 0; right: 0; height: 64px;
      padding: 6px 12px;
      background: #111; color: #ddd;
      font: 13px/1.4 system-ui, sans-serif;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-sizing: border-box;
    }
    .topbar .row { display: flex; gap: 12px; align-items: center; }
    .topbar .meta { color: #888; }
    .topbar a { color: #8fb4ff; text-decoration: none; }
    .topbar a:hover { text-decoration: underline; }

    .tabs { display: flex; gap: 0; }
    .tab {
      background: #222; color: #ccc;
      border: 1px solid #333;
      border-bottom: none;
      padding: 4px 14px;
      font: 13px/1.4 system-ui, sans-serif;
      cursor: pointer;
      border-radius: 4px 4px 0 0;
      margin-right: 2px;
    }
    .tab:hover { background: #2a2a2a; }
    .tab.active {
      background: #1469c8;
      color: #fff;
      border-color: #1469c8;
    }
    .tab[disabled] {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .tab .count { color: #aaa; margin-left: 6px; font-size: 11px; }
    .tab.active .count { color: #cfe2ff; }

    .empty {
      position: absolute; left: 0; right: 0; top: 64px; bottom: 0;
      display: flex; align-items: center; justify-content: center;
      color: #888; font: 14px/1.4 system-ui, sans-serif;
      padding: 0 40px; text-align: center;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="row">
      <strong>MVTM IIIF preview</strong>
      <span id="meta" class="meta">loading…</span>
      <span style="flex:1"></span>
      <a id="manifest-link" href="#" target="_blank">manifest.json</a>
    </div>
    <div class="row tabs">
      <button class="tab active" id="tab-pass1"
              onclick="switchPass('pass1')">
        Pass 1 — raw transcripts <span id="count-pass1" class="count">…</span>
      </button>
      <button class="tab" id="tab-pass2"
              onclick="switchPass('pass2')">
        Pass 2 — items &amp; entities <span id="count-pass2" class="count">…</span>
      </button>
    </div>
  </div>
  <div id="mirador"></div>

  <!-- Mirador 3.x via CDN. unpkg pins to the latest 3.x line. -->
  <script src="https://unpkg.com/mirador@3.4.2/dist/mirador.min.js"></script>
  <script>
    // The same HTML serves two locations:
    //   (a) preview/iiif/mirador.html?issue=YYYY-MM-DD   (central)
    //   (b) preview/iiif/<issue>/mirador.html            (per-issue copy)
    // Try ?issue= first; otherwise pull the date from the parent dir
    // of the current URL path. Both forms must keep working — viewer.html
    // currently links to (b) because per-issue paths proved more reliable
    // through Cloudflare Access.
    const params = new URLSearchParams(window.location.search);
    const ISSUE_DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
    let ISSUE = params.get("issue");
    if (!ISSUE) {
      const segments = window.location.pathname.split("/").filter(Boolean);
      // Walk back from the filename until we find a YYYY-MM-DD segment.
      for (let i = segments.length - 1; i >= 0; i--) {
        if (ISSUE_DATE_RE.test(segments[i])) { ISSUE = segments[i]; break; }
      }
    }
    if (!ISSUE) ISSUE = "1912-12-27"; // ultimate fallback

    // Manifests live at <issue>/manifest_pass{1,2}.json relative to
    // preview/iiif/. Compute that base by walking up to the last
    // segment that's NOT a date directory and NOT the html filename.
    function computeManifestBase() {
      const url = new URL(window.location.href);
      const segs = url.pathname.split("/").filter(Boolean);
      // Strip trailing .html (the file we're on)
      if (segs.length && segs[segs.length - 1].endsWith(".html")) segs.pop();
      // Strip trailing date segment if we're in (b) — we'll re-add ISSUE.
      if (segs.length && ISSUE_DATE_RE.test(segs[segs.length - 1])) segs.pop();
      const root = `${url.origin}/${segs.join("/")}`;
      return `${root}/${ISSUE}`;
    }
    const ISSUE_BASE = computeManifestBase();
    const MANIFESTS = {
      pass1: `${ISSUE_BASE}/manifest_pass1.json`,
      pass2: `${ISSUE_BASE}/manifest_pass2.json`,
    };

    // What's actually available for this issue. Populated by probe().
    const available = { pass1: false, pass2: false };
    const counts = { pass1: "", pass2: "" };
    let viewer = null;

    document.title = `MVTM IIIF preview — ${ISSUE}`;

    // The build script hardcodes the public host
    // (mcmniintstdio.surfaceimpression.com) into the manifest body
    // URLs and target URIs. When the page is served from a different
    // origin (localhost:3000 in dev, or the same host but as the
    // manifest is fetched cross-origin for any other reason),
    // OpenSeaDragon's `<img>` request becomes cross-origin and the
    // browser strips cookies → Cloudflare Access 302s to login → image
    // fails with NS_BINDING_ABORTED. Rewriting body / target URIs to
    // the page's own origin keeps everything same-origin so cookies
    // flow naturally.
    function rewriteOriginInManifest(manifest) {
      const targetOrigin = window.location.origin;
      function patch(u) {
        if (typeof u !== "string") return u;
        try {
          const url = new URL(u);
          // Only rewrite URLs that reference our own MVTM tree —
          // leave external URIs (e.g. iiif.io @context) alone.
          if (!url.pathname.startsWith("/MVTM/")) return u;
          return targetOrigin + url.pathname + url.search + url.hash;
        } catch (e) { return u; }
      }
      // Annotation targets are usually SpecificResource objects with
      // a `source` URL inside; sometimes a bare URL string. Bodies
      // can be a single object, an array of objects, or a string.
      function patchTarget(t) {
        if (typeof t === "string") return patch(t);
        if (t && typeof t === "object") {
          if (typeof t.source === "string") t.source = patch(t.source);
          if (typeof t.id === "string")     t.id     = patch(t.id);
        }
        return t;
      }
      function patchBody(b) {
        if (!b) return b;
        if (Array.isArray(b)) { b.forEach(patchBody); return b; }
        if (typeof b === "object" && typeof b.id === "string") {
          b.id = patch(b.id);
        }
        return b;
      }
      for (const canvas of (manifest.items || [])) {
        canvas.id = patch(canvas.id);
        for (const ap of (canvas.items || [])) {
          ap.id     = patch(ap.id);
          ap.target = patchTarget(ap.target);
          for (const anno of (ap.items || [])) {
            anno.id     = patch(anno.id);
            anno.target = patchTarget(anno.target);
            patchBody(anno.body);
          }
        }
        // Painting annotations are nested under canvas.items; non-
        // painting annotations live in canvas.annotations.
        for (const ap of (canvas.annotations || [])) {
          ap.id     = patch(ap.id);
          ap.target = patchTarget(ap.target);
          for (const anno of (ap.items || [])) {
            anno.id     = patch(anno.id);
            anno.target = patchTarget(anno.target);
            patchBody(anno.body);
          }
        }
      }
      manifest.id = patch(manifest.id);
      return manifest;
    }

    // Cache rewritten manifests by pass so bootViewer can hand
    // Mirador the patched JSON via a Blob URL. probe() populates this.
    const patchedManifestUrls = { pass1: null, pass2: null };

    function bootViewer(pass) {
      const manifestUrl = patchedManifestUrls[pass] || MANIFESTS[pass];
      // Mirador.viewer rewires the existing #mirador div on each call.
      // We rebuild the div on every switch so state from the previous
      // pass (sidebar selection, zoom) doesn't leak across passes.
      const old = document.getElementById("mirador");
      const fresh = document.createElement("div");
      fresh.id = "mirador";
      old.parentNode.replaceChild(fresh, old);

      viewer = Mirador.viewer({
        id: "mirador",
        windows: [{
          manifestId: manifestUrl,
          canvasIndex: 0,
          defaultSideBarPanel: "annotations",
          sideBarOpenByDefault: true,
          highlightAllAnnotations: true,
        }],
        window: {
          allowClose: false,
          defaultSideBarPanel: "annotations",
          sideBarOpenByDefault: true,
        },
        workspace: { type: "single", showZoomControls: true },
        workspaceControlPanel: { enabled: false },
        // Mirador 3.4.2's annotation overlay reads colours from
        // theme.palette.annotations.{default,hovered,selected} and
        // theme.palette.search.{default,hovered,selected}, applied
        // by CanvasAnnotationDisplay (see Mirador
        // src/lib/CanvasAnnotationDisplay.js and the defaults in
        // src/config/settings.js). Defaults are cyan/magenta/yellow.
        // Override `selected` and `hovered` to orange — colour-blind
        // safe and matches the project palette.
        //
        // NB: an earlier attempt used theme.palette.highlights
        // .primary/secondary — that path does NOT exist in Mirador
        // 3.4.2 and was being silently ignored, leaving the yellow
        // default visible.
        //
        // Stroke thickness can't be set here: CanvasAnnotationDisplay
        // overwrites lineWidth with `1 / zoomRatio` per frame. A
        // thicker selected stroke would require a Mirador plugin or
        // a custom OSD overlay hook — not done yet.
        theme: {
          palette: {
            annotations: {
              hovered:  { strokeStyle: "#ff8c00", globalAlpha: 1 },
              selected: { strokeStyle: "#ff8c00", globalAlpha: 1 },
            },
            search: {
              hovered:  { fillStyle: "#ff8c00", globalAlpha: 0.3 },
              selected: { fillStyle: "#ff8c00", globalAlpha: 0.3 },
            },
          },
        },
        // Belt-and-braces alongside the URL-rewrite above: tell
        // OpenSeaDragon not to set `<img>.crossOrigin="anonymous"`,
        // so the CF AppSession cookie flows on same-origin image
        // requests.
        osdConfig: { crossOriginPolicy: false },
      });

      // Keep the manifest-link pointing at the canonical URL so the
      // user can copy it from the topbar — not the Blob URL.
      document.getElementById("manifest-link").href = MANIFESTS[pass];

      // Mirador 3 initialises static-image canvases at native pixels
      // — the user lands staring at the top-left margin and has to
      // hit "reset zoom" to fit the page. Rather than fight OSD's
      // init (which broke annotations last time we tried), wait for
      // Mirador's redux store to report that OSD has finished setting
      // up the viewport, then click the user-visible reset-zoom
      // button. This is exactly what the user does manually.
      autoClickResetZoom(viewer);
    }

    // Click the reset-zoom button once OSD has actually opened a tile
    // source. Earlier attempts that clicked as soon as the button
    // mounted blew up OSD's springs because viewport.contentSize was
    // still (0, 0). Mirador's redux store records non-zero zoom in
    // `state.viewers[windowId]` only after OSD's `open` event fires,
    // so subscribing to the store gives us a clean readiness signal.
    let _resetUnsubscribe = null;
    function autoClickResetZoom(mViewer) {
      if (_resetUnsubscribe) _resetUnsubscribe();
      _resetUnsubscribe = null;
      const SELECTORS = [
        'button[aria-label="Reset zoom"]',
        'button[aria-label="Zoom reset"]',
        'button[aria-label*="reset zoom" i]',
      ].join(", ");
      const clickIfReady = () => {
        const state = mViewer.store.getState();
        const viewers = state.viewers || {};
        // Wait until at least one window has a numeric zoom set —
        // that's the post-`open` state.
        const ready = Object.values(viewers).some(
          v => v && typeof v.zoom === "number" && v.zoom > 0
        );
        if (!ready) return false;
        const root = document.getElementById("mirador");
        const btn = root && root.querySelector(SELECTORS);
        if (!btn || btn.disabled) return false;
        btn.click();
        return true;
      };
      // Subscribe; on every store update, attempt a click.
      _resetUnsubscribe = mViewer.store.subscribe(() => {
        if (clickIfReady()) {
          _resetUnsubscribe();
          _resetUnsubscribe = null;
        }
      });
      // Safety net: stop subscribing after 10s.
      setTimeout(() => {
        if (_resetUnsubscribe) {
          _resetUnsubscribe();
          _resetUnsubscribe = null;
        }
      }, 10000);
    }

    function showEmpty(msg) {
      const old = document.getElementById("mirador");
      const fresh = document.createElement("div");
      fresh.id = "mirador";
      fresh.className = "empty";
      fresh.textContent = msg;
      old.parentNode.replaceChild(fresh, old);
    }

    function switchPass(pass) {
      if (!available[pass]) return;
      document.getElementById("tab-pass1").classList.toggle("active", pass === "pass1");
      document.getElementById("tab-pass2").classList.toggle("active", pass === "pass2");
      bootViewer(pass);
    }

    // Probe each manifest. We fetch the JSON (rather than HEAD) because
    // we want the metadata block too — we use it to populate the tab
    // count labels and the meta line, so users can see e.g. "53 cols ·
    // 21 ads" without opening the manifest.
    function summariseManifest(pass, m) {
      const meta = (m.metadata || []).reduce((acc, r) => {
        const k = (r.label?.en?.[0] || "").toLowerCase();
        const v = (r.value?.en?.[0] || "");
        acc[k] = v;
        return acc;
      }, {});
      const nPages = (m.items || []).length;
      if (pass === "pass1") {
        const cols = meta["columns transcribed"] || "?";
        const ads  = meta["ads transcribed"]     || "?";
        return `(${cols} cols · ${ads} ads · ${nPages} pages)`;
      }
      // pass2
      const items = meta["items detected"] || "?";
      const pgs   = meta["pages with items"] || "?";
      return `(${items} items · pages ${pgs})`;
    }

    async function probe() {
      const tries = await Promise.all([
        fetch(MANIFESTS.pass1).then(r => r.ok ? r.json() : null).catch(() => null),
        fetch(MANIFESTS.pass2).then(r => r.ok ? r.json() : null).catch(() => null),
      ]);
      const [m1, m2] = tries;
      available.pass1 = !!m1;
      available.pass2 = !!m2;

      // Patch hard-coded URLs to match this page's origin and stash a
      // Blob URL for each. Mirador will fetch the Blob (no auth, no
      // redirect) and read body URIs that resolve to same-origin
      // image requests with cookies attached.
      if (m1) {
        rewriteOriginInManifest(m1);
        patchedManifestUrls.pass1 = URL.createObjectURL(
          new Blob([JSON.stringify(m1)], { type: "application/json" })
        );
      }
      if (m2) {
        rewriteOriginInManifest(m2);
        patchedManifestUrls.pass2 = URL.createObjectURL(
          new Blob([JSON.stringify(m2)], { type: "application/json" })
        );
      }

      const pageCount =
        (m1 && m1.items?.length) || (m2 && m2.items?.length) || 0;
      // Wrap the meta in a link back to the issue's detail view in
      // the main MVTM viewer. Absolute /MVTM/ path works from either
      // origin (localhost:3000 dev or the public host).
      const issueHref = `/MVTM/viewer.html?issue=${encodeURIComponent(ISSUE)}`;
      document.getElementById("meta").innerHTML =
        `<a href="${issueHref}">Almonte Gazette · ${ISSUE} · ${pageCount} pages</a>`;

      const t1 = document.getElementById("tab-pass1");
      const t2 = document.getElementById("tab-pass2");
      const c1 = document.getElementById("count-pass1");
      const c2 = document.getElementById("count-pass2");

      if (m1) {
        c1.textContent = summariseManifest("pass1", m1);
      } else {
        c1.textContent = "(not yet)";
        t1.disabled = true;
      }
      if (m2) {
        c2.textContent = summariseManifest("pass2", m2);
      } else {
        c2.textContent = "(not yet)";
        t2.disabled = true;
      }

      // Boot pass-1 if available, else pass-2, else show an empty state.
      if (available.pass1) {
        switchPass("pass1");
      } else if (available.pass2) {
        // Pass-2 is the active tab now.
        t1.classList.remove("active");
        t2.classList.add("active");
        bootViewer("pass2");
      } else {
        showEmpty(
          `No transcription manifests found for ${ISSUE}. ` +
          `Run the build script after pass-1 / pass-2 ingest.`
        );
        document.getElementById("manifest-link").style.display = "none";
      }
    }

    probe();
  </script>
</body>
</html>
