<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MVTM — raw Tesseract hOCR (IIIF)</title>
<!--
  Shows the UNMODIFIED Tesseract hOCR as IIIF annotation layers,
  including the ocr_separator / ocr_photo "stray" blocks that the
  production parser (ocr_llm.parse_hocr) discards. Nothing here is
  derived, scored or corrected -- it is the input every later stage
  builds on, so later stages can be added as further layers and compared
  against it.

  Mirador is the DEFAULT and is the only viewer confirmed working here
  (2026-08-15): it renders these annotation boundaries correctly, which
  also independently proves the manifest is sound and that the Text
  Granularity extension causes no harm.

  TIFY DOES NOT SHOW OVERLAYS FOR THESE MANIFESTS -- unresolved. Reading
  TIFY 0.33's bundle identified one real gate (annotations are only
  fetched when view==='fulltext', or on mobile with view 'scan'/''), and
  setting view:'fulltext' was PREDICTED to fix it. Tested on device: it
  did not. So there is at least one further condition not yet found. Do
  not assume TIFY works; verify on a device before relying on it. Kept
  selectable only for further debugging.

  Annotations are switched ON in each viewer's own config:

  - TIFY     annotationsVisible: true      (clickable overlays)
  - Mirador  annotations.filteredMotivations MUST include 'supplementing'.
             Mirador's default list is
             ['oa:commenting','oa:tagging','sc:painting','commenting','tagging']
             which EXCLUDES supplementing -- the motivation every one of
             our annotations uses (required by the IIIF Text Granularity
             extension). Without this override Mirador silently shows
             nothing. This is also why we embed Mirador ourselves rather
             than linking to a hosted instance we cannot configure.
  Theseus was removed: it is hosted-only (its viewer source is not
  published), so it cannot be run locally, cannot be configured to show
  `supplementing` annotations, and could not fetch a manifest that sits
  behind Cloudflare Access anyway.
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tify@0.33/dist/tify.css">
<style>
  /* EVERY rule here is scoped to #chrome or #stage on purpose.
     A previous version used bare `select {}`, `body { font }` and a
     global `* { box-sizing }` -- those leaked into TIFY and restyled its
     own page-selector, pushing its controls below the image. Do not
     introduce unscoped element selectors in this file: the viewers ship
     their own CSS and must be left alone. */
  :root { color-scheme: light dark; --bar: #f6f8fa; --line: #d8dde5; --fg: #16181d; }
  @media (prefers-color-scheme: dark) {
    :root { --bar: #1c1f25; --line: #2c313a; --fg: #e8eaed; }
  }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; }

  /* One compact row (~34px on mobile) so the viewer gets everything else. */
  #chrome {
    box-sizing: border-box; flex: 0 0 auto;
    display: flex; gap: .35rem; align-items: center;
    font: 13px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--fg);
    padding: .25rem .4rem;
    padding-left: max(.4rem, env(safe-area-inset-left));
    padding-right: max(.4rem, env(safe-area-inset-right));
    background: var(--bar); border-bottom: 1px solid var(--line);
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  #chrome::-webkit-scrollbar { display: none; }
  #chrome select, #chrome a {
    box-sizing: border-box; font: inherit; font-size: 12px;
    padding: .18rem .4rem; border-radius: 5px;
    border: 1px solid var(--line); background: transparent; color: inherit;
    text-decoration: none; white-space: nowrap; flex: 0 0 auto;
  }
  #stage { flex: 1 1 auto; min-height: 0; position: relative; }
  #stage > #tify, #stage > #mirador { position: absolute; inset: 0; }
  #stage .err {
    padding: 1rem; font: 13px/1.4 system-ui, -apple-system, sans-serif;
    color: var(--fg);
  }
</style>
</head>
<body>
<header id="chrome">
  <select id="issue" aria-label="Issue">
    <option value="1980-04-06">1980-04-06</option>
    <option value="1997-07-16">1997-07-16</option>
  </select>
  <select id="layers" aria-label="Pipeline stage">
    <optgroup label="1 · Tesseract">
      <option value="blocks">blocks</option>
      <option value="lines">lines</option>
      <option value="all">blocks + lines</option>
      <option value="separators">separators</option>
    </optgroup>
    <optgroup label="2 · Grid">
      <option value="grid">columns</option>
      <option value="hlines">horizontals</option>
      <option value="boxes">boxed zones</option>
    </optgroup>
    <!-- Not built yet. Shown disabled so the pipeline shape is visible
         without implying these exist. No single-option groups: these two
         belong to one stage anyway. -->
    <optgroup label="3 · Content">
      <option value="items" disabled>items</option>
      <option value="refined" disabled>refined</option>
    </optgroup>
  </select>
  <!-- TIFY hidden 2026-08-15: it does not render overlays for these
       manifests (unresolved). Mirador is forced below. Restore by
       un-commenting this block -- all TIFY code below is intact and
       still reachable with ?viewer=tify.
  <select id="viewer" aria-label="Viewer">
    <option value="mirador">Mirador</option>
    <option value="tify">TIFY</option>
  </select>
  -->
  <a class="btn" id="manifest-link" target="_blank" rel="noopener">manifest ↗</a>
</header>
<div id="stage"></div>

<script>
window.__cfg = (function () {
  var q = new URLSearchParams(location.search);
  var issue = q.get('issue') || '1980-04-06';
  var viewer = q.get('viewer') || 'mirador';
  // 'fulltext' is required for TIFY to load/draw annotations at all
  // (see the note at the Tify() call). Overridable for experimentation.
  var view = q.get('view') || 'fulltext';
  // Block and line boxes overlap heavily when drawn together, so each
  // set has its own manifest. Default to blocks: that is the view that
  // makes column structure legible.
  var layers = q.get('layers') || 'grid';
  var rel = issue + (layers === 'all' ? '/manifest.json'
                                      : '/manifest_' + layers + '.json');
  // Stage 2 draws far fewer, much larger boxes than stage 1, so its
  // manifests are small -- no special handling needed, they load the
  // same way.
  var abs = new URL(rel, location.href).href;

  // Switching layer reloads the page, so where the reader was looking has
  // to survive in the URL. `page` is the important one -- comparing
  // stage 2 against stage 1 on a DIFFERENT page is useless. x/y/z restore
  // the zoom and pan too.
  //
  // Canvas ids are IDENTICAL across every manifest variant (verified:
  // .../canvas/p5 in blocks, grid, hlines and boxes alike), so the page
  // carries across cleanly and can be rebuilt from its number alone.
  var page = parseInt(q.get('page'), 10);
  if (!(page > 0)) page = null;
  var vx = parseFloat(q.get('x')), vy = parseFloat(q.get('y')),
      vz = parseFloat(q.get('z'));
  var canvasBase = new URL(issue + '/canvas/', location.href).href;

  var si = document.getElementById('issue'), sl = document.getElementById('layers');
  // May be absent while the TIFY selector is commented out of the DOM.
  var sv = document.getElementById('viewer');
  if ([].some.call(si.options, function (o) { return o.value === issue; })) si.value = issue;
  if (sv && [].some.call(sv.options, function (o) { return o.value === viewer; })) sv.value = viewer;
  if ([].some.call(sl.options, function (o) { return o.value === layers; })) sl.value = layers;

  // Filled in by the Mirador block below as the reader moves around.
  window.__here = { page: page, x: vx, y: vy, z: vz };

  function go(keepPosition) {
    var h = window.__here || {};
    var s = '?issue=' + si.value + '&layers=' + sl.value +
            (sv ? '&viewer=' + sv.value : '') +
            (view !== 'fulltext' ? '&view=' + view : '');
    // Changing ISSUE means a different document, so position is dropped.
    if (keepPosition && h.page) {
      s += '&page=' + h.page;
      if (isFinite(h.x) && isFinite(h.y) && isFinite(h.z)) {
        s += '&x=' + Math.round(h.x) + '&y=' + Math.round(h.y) +
             '&z=' + h.z.toPrecision(6);
      }
    }
    location.search = s;
  }
  si.addEventListener('change', function () { go(false); });
  if (sv) sv.addEventListener('change', function () { go(true); });
  sl.addEventListener('change', function () { go(true); });

  document.getElementById('manifest-link').href = rel;

  return { issue: issue, viewer: viewer, view: view, layers: layers,
           rel: rel, abs: abs, page: page, canvasBase: canvasBase,
           x: vx, y: vy, z: vz };
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/tify@0.33/dist/tify.js"></script>
<script src="https://unpkg.com/mirador@3.4.2/dist/mirador.min.js"></script>
<script>
(function () {
  var cfg = window.__cfg;
  var stage = document.getElementById('stage');

  function fail(msg) { stage.innerHTML = '<div class="err">' + msg + '</div>'; }

  if (cfg.viewer === 'mirador') {
    if (typeof Mirador === 'undefined') return fail('Mirador failed to load from the CDN.');
    stage.innerHTML = '<div id="mirador"></div>';
    // An explicit window id, so the store can be read back below without
    // having to guess Mirador's generated one.
    var WID = 'w';
    var win = { id: WID, manifestId: cfg.abs };
    // Reopen on the page the reader was on. `canvasId` is the documented
    // per-window key for this (Mirador config reference, "Initial Windows
    // Configuration").
    if (cfg.page) win.canvasId = cfg.canvasBase + 'p' + cfg.page;
    // ...and at the same zoom and pan. `initialViewerConfig` is the
    // documented way to set the opening viewport; image position (x, y,
    // zoom) lives under the state's `viewers` key, which is what the
    // subscription below reads.
    if (isFinite(cfg.x) && isFinite(cfg.y) && isFinite(cfg.z)) {
      win.initialViewerConfig = { x: cfg.x, y: cfg.y, zoom: cfg.z };
    }
    var mi = Mirador.viewer({
      id: 'mirador',
      windows: [win],
      window: {
        // Draw every annotation boundary on load instead of only on
        // hover/selection. Verified against the Mirador 3.4.2 bundle:
        // the default config carries `highlightAllAnnotations: false`,
        // each window initialises from
        // `config.window.highlightAllAnnotations || false`, and the
        // annotations toggle button simply flips this same key
        // (TOGGLE_ANNOTATION_DISPLAY). So setting it here IS the
        // "boundaries visible by default" switch.
        highlightAllAnnotations: true,
        // Open on the annotation list rather than making the reviewer
        // dig for it. Must live at config level under this exact name:
        // window creation reads
        //   s.sideBarPanel || f.window.defaultSideBarPanel || f.window.sideBarPanel
        // where `s` is the per-window spec -- so a per-window override
        // would have to be spelled `sideBarPanel`, NOT
        // `defaultSideBarPanel`. It was previously set per-window under
        // the config-level name and therefore did nothing.
        defaultSideBarPanel: 'annotations',
        sideBarOpen: true,
        allowFullscreen: true,
        allowMaximize: false
      },
      workspaceControlPanel: { enabled: false },
      annotations: {
        // MUST include 'supplementing' -- see the note at the top of this
        // file. Mirador's default list omits it and our annotations would
        // be filtered out entirely.
        filteredMotivations: ['supplementing', 'commenting', 'tagging',
                              'oa:commenting', 'oa:tagging']
      }
    });

    // Track where the reader is, so switching layer can reopen there.
    // Everything is defensive: if a future Mirador changes the state
    // shape, this degrades to "reopens at page 1" rather than throwing
    // and taking the viewer down with it.
    try {
      mi.store.subscribe(function () {
        try {
          var st = mi.store.getState();
          var w = st.windows && st.windows[WID];
          var h = window.__here || (window.__here = {});
          // Page comes from the canvas id, not an index: we mint those ids
          // ourselves as .../canvas/p<N>, so this needs no assumption
          // about how Mirador orders or numbers canvases.
          var cid = w && (w.canvasId ||
                          (w.visibleCanvases && w.visibleCanvases[0]));
          if (cid) {
            var m = /\/canvas\/p(\d+)$/.exec(cid);
            if (m) h.page = parseInt(m[1], 10);
          }
          var v = st.viewers && st.viewers[WID];
          if (v && isFinite(v.x) && isFinite(v.y) && isFinite(v.zoom)) {
            h.x = v.x; h.y = v.y; h.z = v.zoom;
          }
        } catch (e) { /* leave __here as it was */ }
      });
    } catch (e) { /* no store: page/zoom simply won't persist */ }
    return;
  }

  if (typeof Tify === 'undefined') {
    return fail('TIFY failed to load from the CDN. Open <code>' + cfg.rel +
                '</code> directly, or switch viewer.');
  }
  stage.innerHTML = '<div id="tify"></div>';
  new Tify({
    container: '#tify',
    manifestUrl: cfg.rel,   // relative keeps it same-origin behind Cloudflare Access
    annotationsVisible: true,
    // MUST NOT be null. From TIFY 0.33's own bundle:
    //   annotationsActive = view === 'fulltext'
    //                    || ['scan',''].includes(view) && annotationsVisible !== false
    //                       && isMobile()
    // and annotations are only FETCHED when annotationsActive is true.
    // `view: null` therefore gave no overlays AND no annotations toggle
    // icon (the icon renders only when annotations.length > 0). Setting
    // 'fulltext' fixes THAT gate -- but overlays still do not appear on
    // device, so something further is wrong. Unresolved; see the note at
    // the top of this file.
    view: cfg.view,
    urlQueryKey: 'tify',
    viewer: { immediateRender: true }
  });
})();
</script>
</body>
</html>
